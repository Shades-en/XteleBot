[project]
name = "telebot"
version = "0.1.0"
description = "Minimal Telegram bot using aiogram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.25.0",
  "python-dotenv==1.0.1",
]

[project.scripts]
telebot = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
