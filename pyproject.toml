[project]
name = "telebot"
version = "0.2.0"
description = "X Content Copilot Telegram bot with Postgres and Agno workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agno>=2.0.0",
  "aiogram==3.25.0",
  "alembic>=1.14.0",
  "fastapi>=0.115.12",
  "greenlet>=3.1.1",
  "httpx>=0.28.1",
  "langchain-text-splitters>=0.3.8",
  "openai>=1.68.2",
  "psycopg[binary]>=3.2.6",
  "python-dotenv==1.0.1",
  "pypdf>=5.4.0",
  "requests>=2.32.3",
  "sqlalchemy>=2.0.39",
  "trafilatura>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
